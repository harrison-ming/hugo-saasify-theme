{{ if hugo.IsMultilingual }}
<div class="relative group">
    <button class="flex items-center text-sm text-gray-700 hover:text-primary-600 font-medium transition-colors duration-150">
        {{ .Site.Language.LanguageName }}
        <svg class="ml-1 shrink-0" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </button>
    <div class="absolute left-1/2 -translate-x-1/2 mt-3 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 ease-in-out" style="width:7rem">
        <div class="py-1 bg-white border border-gray-200 shadow-lg rounded-md">
            {{ if $.IsTranslated }}
                {{ range $.Translations }}
                <a href="{{ .RelPermalink }}" class="language-switch-link block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-primary-600 transition-colors whitespace-nowrap" data-lang="{{ .Language.Lang }}">
                    {{ .Language.LanguageName }}
                </a>
                {{ end }}
            {{ else }}
                {{ range .Site.Languages }}
                {{ if ne $.Site.Language.Lang .Lang }}
                {{ $langURL := printf "/%s/" .Lang }}
                <a href="{{ $langURL }}" class="language-switch-link block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-primary-600 transition-colors whitespace-nowrap" data-lang="{{ .Lang }}">
                    {{ .LanguageName }}
                </a>
                {{ end }}
                {{ end }}
            {{ end }}
        </div>
    </div>
</div>
{{ end }}
